# 允許送出驗證請求的網路設備（RADIUS 用戶端）。
# 值由環境變數帶入，見 .env.example；不在清單內的來源 IP 一律不回應。

client fortigate {
	ipaddr = $ENV{FORTIGATE_IP}
	proto = udp
	secret = $ENV{RADIUS_SECRET}
	require_message_authenticator = yes
	nas_type = other
}

# 僅供在容器內用 eapol_test 自我檢測
client localhost {
	ipaddr = 127.0.0.1
	proto = udp
	secret = $ENV{RADIUS_SECRET}
	nas_type = other
}
